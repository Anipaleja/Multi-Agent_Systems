[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "brevitas-systems"
version = "0.1.0"
description = "Token-efficient multi-agent pipeline optimization"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Brevitas Systems" }]
keywords = ["llm", "tokens", "agents", "optimization", "cost"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.24.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "hatch>=1.7",
    "twine>=5.0",
    "build>=1.0",
]

[project.urls]
Homepage = "https://brevitas.systems"
Repository = "https://github.com/brevitas-systems/brevitas"

[tool.hatch.build.targets.wheel]
packages = ["src/brevitas"]

[tool.hatch.build.targets.sdist]
include = ["src/", "README.md", "pyproject.toml"]
